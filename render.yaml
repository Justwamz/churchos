# ChurchOS on Render: a STAGING / DEMO deployment (see docs/deploy-render.md).
# One API and four web apps. The demo churches and people are loaded each time the API starts, and everything is simulated
# (payments, SMS, email), so nothing real moves. Sign-in uses the fixed development code until real SMS sign-in is built.
#
# When you create this Blueprint, Render asks for the values marked "sync: false". Fill them in with the addresses Render shows
# for the five services (docs/deploy-render.md explains which is which).
services:
  - type: web
    name: churchos-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install -g pnpm@10.29.2 && pnpm install --frozen-lockfile --prod=false
    startCommand: pnpm --filter @churchos/api start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: NODE_ENV # production mode: no sign-in code on screen, no dev tools, security headers incl. HSTS. The demo sign-in still works because ALLOW_DEV_OTP=1 below.
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: TRUST_PROXY_HOPS # how many proxies sit in front of the API: 2 = Render's edge plus Cloudflare (docs/deploy-render.md shows how to check)
        value: "2"
      - key: ALLOW_DEMO_PSP # DEMO ONLY: production mode refuses to start with the payment simulator unless this is 1. A real launch sets PSP_MODE=live and removes it.
        value: "1"
      - key: ALLOW_DEMO_SEED # DEMO ONLY: production mode refuses to start with demo data unless this is 1. A real launch sets SEED_DEMO=0 and removes it.
        value: "1"
      - key: ENFORCE_LEGAL_ACCEPTANCE # The API refuses signed-in requests until the person has accepted the current Terms and Privacy Notice.
        value: "1"
      - key: SEED_DEMO
        value: "1"
      - key: LISTEN_EARLY
        value: "1"
      - key: ALLOW_DEV_OTP # the demo uses the fixed development sign-in code (Render runs Node services in production mode)
        value: "1"
      - key: CHURCHOS_AUTH_SECRET
        generateValue: true
      - key: GIVING_URL # the address of the giving site, for example https://churchos-giving.onrender.com (used in links in messages)
        sync: false
      - key: CORS_ORIGINS # the addresses of the four web apps, separated by commas, so only they can call the API
        sync: false

  - type: web
    name: churchos-staff
    runtime: static
    buildCommand: npm install -g pnpm@10.29.2 && pnpm install --frozen-lockfile --prod=false && pnpm --filter @churchos/staff build
    staticPublishPath: apps/staff/dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: VITE_API_URL
        sync: false
      - key: VITE_VERIFY_ORIGIN
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://churchos-api.onrender.com; font-src 'self' data:; connect-src 'self' https://churchos-api.onrender.com; manifest-src 'self' blob:; worker-src 'self'; frame-src blob:; object-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin-allow-popups
      - path: /*
        name: Permissions-Policy
        value: "camera=(self), geolocation=(self), microphone=(), payment=(), usb=(), bluetooth=(), interest-cohort=()"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache

